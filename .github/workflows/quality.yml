name: quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: go vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: test
        run: go test -race -count=1 ./...

      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      
      - name: mutation testing
        run: gremlins unleash --output=mutation-report.json  
      
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.json
          if-no-files-found: ignore
          
  crap:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: download mutation report
        uses: actions/download-artifact@v4
        with:
          name: mutation-report
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: install go-crap
        run: go install github.com/padiazg/go-crap@latest

      - name: crap scoring
        id: crap
        continue-on-error: true
        run: go-crap scan --fail-above --threshold 300 --exclude '.*_test\.go'

      - name: generate pr comment
        if: always()
        run: go-crap scan --format pr-comment --threshold 300 --exclude '.*_test\.go' --output pr-comment.md || true

      - name: post pr comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_FOR_PR_COMMENTS || github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) return;
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const prNumber = context.issue.number;
            if (!prNumber) return;
            const marker = '<!-- go-crap-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: fail if crap exceeded threshold
        if: steps.crap.outcome != 'success'
        run: exit 1
