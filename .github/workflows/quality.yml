name: quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: go vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: test
        run: go test -race -count=1 ./...

      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      
      - name: mutation testing
        run: gremlins unleash --output=mutation-report.json  
      
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.json
          if-no-files-found: ignore
          
  crap:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: download mutation report
        uses: actions/download-artifact@v4
        with:
          name: mutation-report
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: install go-crap
        run: go install github.com/padiazg/go-crap@latest

      - name: crap scoring
        id: crap
        continue-on-error: true
        run: go-crap scan --fail-above --threshold 300 --exclude '.*_test\.go'

      - name: generate pr comment
        if: always()
        run: go-crap scan --format pr-comment --threshold 300 --exclude '.*_test\.go' --output pr-comment.md || true

      - name: get pr number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crap-comment
          path: |
            pr-comment.md
            pr-number.txt
          if-no-files-found: ignore

      - name: fail if crap exceeded threshold
        if: steps.crap.outcome != 'success'
        run: exit 1
