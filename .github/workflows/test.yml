name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - run: go test -race -count=1 ./...
      - run: go build -o hexago .

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
