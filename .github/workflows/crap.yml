name: crap
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  crap:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - name: install go-crap
        run: go install github.com/padiazg/go-crap@latest
      - name: score
        run: go-crap scan --fail-above --threshold 300 --exclude '.*_test\.go'
      - name: generate pr comment
        run: go-crap scan --format pr-comment --threshold 300 --exclude '.*_test\.go' --output pr-comment.md || true
      - name: get pr number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crap-comment
          path: |
            pr-comment.md
            pr-number.txt
          if-no-files-found: ignore
